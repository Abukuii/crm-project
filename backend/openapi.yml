components:
  schemas:
    Access:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    AuthResponse:
      type: object
      properties:
        access:
          type: string
        user:
          $ref: '#/components/schemas/Me'
      required:
      - access
      - user
    Branch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nomi
          maxLength: 200
        address:
          type: string
          maxLength: 300
        phone:
          type: string
          maxLength: 32
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    BranchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          title: Nomi
          maxLength: 200
        address:
          type: string
          maxLength: 300
        phone:
          type: string
          maxLength: 32
        is_active:
          type: boolean
      required:
      - name
    Brand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nomi
          maxLength: 150
      required:
      - id
      - name
    BrandRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          title: Nomi
          maxLength: 150
      required:
      - name
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nomi
          maxLength: 150
        parent:
          type: integer
          nullable: true
        sort:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - id
      - name
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          title: Nomi
          maxLength: 150
        parent:
          type: integer
          nullable: true
        sort:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - name
    CurrencyEnum:
      enum:
      - USD
      type: string
      description: '* `USD` - USD'
    CurrentRate:
      type: object
      properties:
        currency:
          type: string
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        date:
          type: string
          format: date
        source:
          type: string
      required:
      - currency
      - date
      - rate
      - source
    ExchangeRate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        currency:
          type: string
          readOnly: true
        date:
          type: string
          format: date
          readOnly: true
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
          readOnly: true
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - currency
      - date
      - id
      - rate
      - source
      - updated_at
    Health:
      type: object
      properties:
        status:
          type: string
        db:
          type: boolean
      required:
      - db
      - status
    LanguageEnum:
      enum:
      - uz
      - ru
      type: string
      description: |-
        * `uz` - O'zbekcha
        * `ru` - Русский
    LoginRequestRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    ManualRateRequest:
      type: object
      properties:
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          default: USD
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        date:
          type: string
          format: date
      required:
      - rate
    Me:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 32
        language:
          $ref: '#/components/schemas/LanguageEnum'
        theme:
          $ref: '#/components/schemas/ThemeEnum'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleBrief'
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          readOnly: true
        tenant:
          allOf:
          - $ref: '#/components/schemas/TenantBrief'
          nullable: true
          readOnly: true
        branch_ids:
          type: array
          items:
            type: integer
          nullable: true
          readOnly: true
        max_discount_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
        has_pin:
          type: boolean
          readOnly: true
      required:
      - branch_ids
      - has_pin
      - id
      - max_discount_percent
      - permissions
      - roles
      - tenant
      - username
    PaginatedBranchList:
      type: object
