components:
  schemas:
    Access:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    AuthResponse:
      type: object
      properties:
        access:
          type: string
        user:
          $ref: '#/components/schemas/Me'
      required:
      - access
      - user
    Branch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nomi
          maxLength: 200
        address:
          type: string
          maxLength: 300
        phone:
          type: string
          maxLength: 32
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    BranchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          title: Nomi
          maxLength: 200
        address:
          type: string
          maxLength: 300
        phone:
          type: string
          maxLength: 32
        is_active:
          type: boolean
      required:
      - name
    Brand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nomi
          maxLength: 150
      required:
      - id
      - name
    BrandRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          title: Nomi
          maxLength: 150
      required:
      - name
    CancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 300
    CashMove:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/CashMoveKindEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        note:
          type: string
          maxLength: 300
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - id
      - kind
    CashMoveKindEnum:
      enum:
      - in
      - out
      type: string
      description: |-
        * `in` - Kirim
        * `out` - Chiqim
    CashMoveRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/CashMoveKindEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        note:
          type: string
          maxLength: 300
      required:
      - amount
      - kind
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nomi
          maxLength: 150
        parent:
          type: integer
          nullable: true
        sort:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - id
      - name
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          title: Nomi
          maxLength: 150
        parent:
          type: integer
          nullable: true
        sort:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - name
