<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Brauzer/status qatori rangi ilova mavzusiga moslashadi -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1220" />
    <link rel="icon" type="image/svg+xml" href="/savdo-icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- iOS: "Uyga qo'shish" orqali o'rnatilganda to'liq ekranda ochiladi -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Savdo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Savdo — savdo va ombor boshqaruvi</title>
    <meta name="description" content="Savdo — kassa, ombor, nasiya va hisobotlar bitta tizimda" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Birinchi chizishdan oldin mavzuni qo'llash (oq "miltillash" bo'lmasin)
      try {
        const t = localStorage.getItem("theme") || "system";
        const dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
