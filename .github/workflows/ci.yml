name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_test
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://crm:crm@localhost:5432/crm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migratsiyalar to'liqmi
        run: DJANGO_SETTINGS_MODULE=config.settings.test python manage.py makemigrations --check --dry-run
      - name: OpenAPI sxema dolzarbmi
        run: |
          DJANGO_SETTINGS_MODULE=config.settings.test python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yml
          diff -u openapi.yml /tmp/openapi.yml
      - name: Testlar (PostgreSQL)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API tiplari sxemaga mos
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npm test
      - run: npm run build

  # Testlar yashil bo'lsa — commit "production" branch'iga ko'chiriladi.
  # Server (infra/deploy/auto-update.sh) faqat shu branch'ni kuzatadi va o'zi tortib oladi.
  promote:
    name: Production'ga chiqarish
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: promote-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: main → production
        run: |
          git push origin "HEAD:refs/heads/production" --force
          echo "Production: $(git rev-parse --short HEAD) — server 2 daqiqa ichida yangilanadi" >> "$GITHUB_STEP_SUMMARY"
