# Lokal ishlab chiqish: faqat PostgreSQL va Redis konteynerda.
# Backend va frontend kompyuterda to'g'ridan-to'g'ri ishlaydi (tez qayta yuklanish uchun).
name: qurilish-crm-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata-dev:
